# Note: In case teledash main backend and this project are not running on the same docker network,
# remove the `networks` section and the `${TELEDASH_DOCKER_NETWORK}` variable from the services.
#
# GPU Support: For GPU-enabled services (classification, asr), uncomment the `reservations.devices`
# section under `deploy.resources` when GPU_USE=true in .env. Leave commented for CPU-only mode.
services:
  classification:
    profiles: ["classification", "all"]
    build: &classification-build
      context: .
      dockerfile: ./services/classification/Dockerfile
      args:
        GPU_USE: "${GPU_USE}"
        CONTAINER_TYPE: worker
    environment:
      CONTAINER_TYPE: worker
    container_name: classification
    volumes: &classification-volumes
      - classification-bashhistory:/commandhistory
      - classification-tmp:/app/tmp
    networks: &network
      - ${TELEDASH_DOCKER_NETWORK}
    env_file: &env
      - .env
    command: celery --app=main worker --loglevel=INFO --queues=classification --hostname=classification-worker@%h --concurrency=1
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
        # GPU support enabled
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE}"]
              capabilities: [gpu]

  classification-beat:
    profiles: ["classification", "all"]
    build:
      <<: *classification-build
      args:
        GPU_USE: "${GPU_USE}"
        CONTAINER_TYPE: beat
    container_name: classification-beat
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: beat
    command: celery --app=main beat --loglevel=INFO
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"

  text-embeddings:
    profiles: ["text-search", "all"]
    build: &text-embeddings-build
      context: .
      dockerfile: ./services/semantic_text_search/embedding_worker/Dockerfile
      args:
        CONTAINER_TYPE: worker
    container_name: text-embeddings
    volumes: &text-embeddings-volumes
      - text-embeddings-tmp:/app/tmp
      - text-embeddings-bashhistory:/commandhistory
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: worker
    command: celery --app=main worker --loglevel=INFO --queues=text-embeddings --hostname=text-embedding-worker@%h --concurrency=1
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 8g # Recommended starting limit for paraphrase-multilingual-MiniLM-L12-v2 (float32, batch_size=32).
          cpus: "2"

  text-embeddings-beat:
    profiles: ["text-search", "all"]
    build:
      <<: *text-embeddings-build
      args:
        CONTAINER_TYPE: beat
    container_name: text-embeddings-beat
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: beat
    command: celery --app=main beat --loglevel=INFO
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  text-search-api:
    profiles: ["text-search", "all"]
    build:
      context: .
      dockerfile: ./services/semantic_text_search/api/Dockerfile
    container_name: text-search-api
    volumes: *text-embeddings-volumes
    networks: *network
    env_file: *env
    command: uvicorn main:app --host 0.0.0.0 --port ${TEXT_FAST_API_PORT}
    # ports:
    #  - ${TEXT_FAST_API_PORT}:${TEXT_FAST_API_PORT} # hostport:containerport
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  image-embeddings:
    profiles: ["image-search", "all"]
    build: &image-embeddings-build
      context: .
      dockerfile: ./services/semantic_image_search/embedding_worker/Dockerfile
      args:
        CONTAINER_TYPE: worker
    container_name: image-embeddings
    volumes: &image-embeddings-volumes
      - image-embeddings-tmp:/app/tmp
      - image-embeddings-bashhistory:/commandhistory
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=image-embeddings --hostname=image-embedding-worker@%h --concurrency=1
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"

  image-embeddings-beat:
    profiles: ["image-search", "all"]
    build:
      <<: *image-embeddings-build
      args:
        CONTAINER_TYPE: beat
    container_name: image-embeddings-beat
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: beat
    command: celery --app=main beat --loglevel=INFO
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"

  image-search-api:
    profiles: ["image-search", "all"]
    build:
      context: .
      dockerfile: ./services/semantic_image_search/api/Dockerfile
    container_name: image-search-api
    volumes: *image-embeddings-volumes
    networks: *network
    env_file: *env
    command: uvicorn main:app --host 0.0.0.0 --port ${IMAGE_FAST_API_PORT} # TODO: change if not the same API port as semantic search
    # ports:
    #  - ${IMAGE_FAST_API_PORT}:${IMAGE_FAST_API_PORT} # hostport:containerport
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  asr:
    profiles: ["asr", "all"]
    build: &asr-build
      context: .
      dockerfile: ./services/asr/Dockerfile
      args:
        GPU_USE: "${GPU_USE}"
        CONTAINER_TYPE: worker
    container_name: asr
    volumes:
      - asr-bashhistory:/commandhistory
      - asr-tmp:/app/tmp
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: worker
    command: celery --app=main worker --loglevel=INFO --queues=asr --hostname=asr-worker@%h --pool=threads --concurrency=${ASR_CONCURRENCY}
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 16g # Increase based on ASR model size and concurrency.
          cpus: "4"
        # GPU support enabled
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE}"]
              capabilities: [gpu]

  asr-beat:
    profiles: ["asr", "all"]
    build:
      <<: *asr-build
      args:
        CONTAINER_TYPE: beat
    container_name: asr-beat
    networks: *network
    env_file: *env
    environment:
      CONTAINER_TYPE: beat
    command: celery --app=main beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  sentiment:
    profiles: ["sentiment", "text-analysis", "all"]
    build: &sentiment-build
      context: .
      dockerfile: ./services/sentiment/Dockerfile
      args:
        COMPUTE_TYPE: "${COMPUTE_TYPE:-cpu}"
    container_name: sentiment
    volumes: &sentiment-volumes
      - sentiment-bashhistory:/commandhistory
      - sentiment-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=sentiment --hostname=sentiment-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
        # GPU support (optional, uncomment if GPU_USE=true)
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       device_ids: ["${GPU_DEVICE}"]
        #       capabilities: [gpu]

  ner:
    profiles: ["ner", "text-analysis", "all"]
    build: &ner-build
      context: .
      dockerfile: ./services/ner/Dockerfile
    container_name: ner
    volumes: &ner-volumes
      - ner-bashhistory:/commandhistory
      - ner-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=ner --hostname=ner-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

  ngrams:
    profiles: ["ngrams", "text-analysis", "all"]
    build: &ngrams-build
      context: .
      dockerfile: ./services/ngrams/Dockerfile
    container_name: ngrams
    volumes: &ngrams-volumes
      - ngrams-bashhistory:/commandhistory
      - ngrams-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=ngrams --hostname=ngrams-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  export:
    profiles: ["export", "text-analysis", "all"]
    build: &export-build
      context: .
      dockerfile: ./services/export/Dockerfile
    container_name: export
    volumes: &export-volumes
      - export-bashhistory:/commandhistory
      - export-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=worker.export.tasks worker --loglevel=INFO --queues=export --hostname=export-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2"

  topic-modeling:
    profiles: ["topic-modeling", "text-analysis", "all"]
    build: &topic-modeling-build
      context: .
      dockerfile: ./services/topic_modeling/Dockerfile
      args:
        COMPUTE_TYPE: "${COMPUTE_TYPE:-cpu}"
    container_name: topic-modeling
    volumes: &topic-modeling-volumes
      - topic-modeling-bashhistory:/commandhistory
      - topic-modeling-tmp:/app/tmp
      - topic-modeling-models:/app/models
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=topic_modeling --hostname=topic_modeling-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
        # GPU support (optional, uncomment if GPU_USE=true)
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       device_ids: ["${GPU_DEVICE}"]
        #       capabilities: [gpu]

  network-analysis:
    profiles: ["network-analysis", "all"]
    build:
      context: .
      dockerfile: ./services/network_analysis/Dockerfile
    container_name: network-analysis
    volumes:
      - network-analysis-bashhistory:/commandhistory
      - network-analysis-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=network_analysis --hostname=network-analysis-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

  temporal-analysis:
    profiles: ["temporal-analysis", "all"]
    build:
      context: .
      dockerfile: ./services/temporal_analysis/Dockerfile
    container_name: temporal-analysis
    volumes:
      - temporal-analysis-bashhistory:/commandhistory
      - temporal-analysis-tmp:/app/tmp
    networks: *network
    env_file: *env
    command: celery --app=main worker --loglevel=INFO --queues=temporal_analysis --hostname=temporal-analysis-worker@%h --concurrency=2
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.14.3
  #   container_name: kibana
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://${ELASTIC_HOST}:${ELASTIC_PORT}
  #     - SERVER_NAME=kibana
  #   networks: *network
  #   env_file: *env
  #   command: tail -f /dev/null
  #   depends_on:
  #     - redis-processing

  redis-processing:
    image: redis:latest
    container_name: redis-processing
    networks: *network
    expose:
      - ${REDIS_PORT}
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "0.5"

  monitoring:
    profiles: ["monitoring", "all"]
    build:
      context: .
      dockerfile: ./services/monitoring/Dockerfile
    container_name: monitoring
    networks: *network
    env_file: *env
    ports:
      - "8003:8003"  # Expose monitoring API
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    depends_on:
      - redis-processing
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  classification-bashhistory:
  classification-tmp:
  text-embeddings-bashhistory:
  text-embeddings-tmp:
  image-embeddings-bashhistory:
  image-embeddings-tmp:
  asr-bashhistory:
  asr-tmp:
  sentiment-bashhistory:
  sentiment-tmp:
  ner-bashhistory:
  ner-tmp:
  ngrams-bashhistory:
  ngrams-tmp:
  export-bashhistory:
  export-tmp:
  topic-modeling-bashhistory:
  topic-modeling-tmp:
  topic-modeling-models:
  network-analysis-bashhistory:
  network-analysis-tmp:
  temporal-analysis-bashhistory:
  temporal-analysis-tmp:

networks:
  teledash_default: # here ${TELEDASH_DOCKER_NETWORK} doesn't work, cause its a key. Needs to be replaced if name differs from default.
    external: true
